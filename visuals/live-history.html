<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Replay persisted BTCUSDT live anomaly episodes by local calendar day.">
  <title>BTC Episode History | Crypto Anomaly Analyser</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171916'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23a33d2d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary:#a33d2d; --color-background:#f3efe6; --color-surface:#fbf8f1; --color-surface-strong:#fff;
      --color-ink:#171916; --color-ink-muted:#5b605a; --color-rule:#b9b5aa; --color-rule-light:#ded9ce;
      --color-anomaly:#a33d2d; --color-derivatives:#245d78; --color-news:#556b43; --color-warning:#8b641d; --color-on-dark:#fffaf0;
      --font-display:"Newsreader",Georgia,serif; --font-body:"Source Sans 3",Arial,sans-serif; --font-data:"IBM Plex Mono",monospace;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--color-background); color:var(--color-ink); font:400 16px/1.5 var(--font-body); }
    button, a, select { color:inherit; font:inherit; }
    button:focus-visible, a:focus-visible, select:focus-visible { outline:2px solid var(--color-primary); outline-offset:3px; }
    .skip { position:fixed; top:-60px; left:16px; z-index:20; padding:9px 13px; background:var(--color-ink); color:var(--color-on-dark); }
    .skip:focus { top:12px; }
    .shell { min-height:58px; display:flex; align-items:stretch; border-bottom:1px solid var(--color-ink); background:var(--color-surface); }
    .brand { width:230px; display:flex; align-items:center; gap:10px; padding:0 18px; border-right:1px solid var(--color-rule); font:600 12px/1 var(--font-data); letter-spacing:.08em; text-transform:uppercase; }
    .brand-mark { width:10px; height:10px; background:var(--color-anomaly); transform:rotate(45deg); }
    .runtime { display:flex; align-items:center; margin:8px 12px; border:1px solid var(--color-ink); padding:0 11px; font:600 12px/1 var(--font-data); letter-spacing:.07em; text-transform:uppercase; }
    .shell-meta { display:flex; align-items:center; padding:0 18px; color:var(--color-ink-muted); font:500 12px/1 var(--font-data); }
    .shell-link { margin-left:auto; display:flex; align-items:center; border-left:1px solid var(--color-rule); padding:0 18px; font:600 12px/1 var(--font-data); letter-spacing:.05em; text-decoration:none; }
    .shell-link:hover { text-decoration:underline; text-underline-offset:3px; }
    main { max-width:1480px; margin:0 auto; padding:22px 18px 24px; }
    .label { color:var(--color-ink-muted); font:500 12px/1.3 var(--font-data); letter-spacing:.1em; text-transform:uppercase; }
    .episode-nav { display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:15px; }
    .episode-nav h1 { margin:4px 0 0; font:500 36px/1 var(--font-display); letter-spacing:-.02em; }
    .episode-controls { display:flex; align-items:center; border:1px solid var(--color-rule); background:var(--color-surface); }
    .episode-controls button { min-height:40px; border:0; background:transparent; padding:0 14px; cursor:pointer; font:500 12px/1 var(--font-data); letter-spacing:.06em; text-transform:uppercase; }
    .episode-controls button:disabled { cursor:default; opacity:.4; }
    .episode-controls > * + * { border-left:1px solid var(--color-rule); }
    .episode-position { min-width:96px; padding:0 13px; font:500 12px/40px var(--font-data); text-align:center; }
    .anomaly-card { border:1px solid var(--color-ink); background:var(--color-surface); }
    .anomaly-head, .section-head { display:flex; justify-content:space-between; align-items:center; gap:18px; padding:12px 15px; border-bottom:1px solid var(--color-rule); }
    .anomaly-head h2, .section-head h2 { margin:0; font:500 20px/1.15 var(--font-display); }
    .trigger-badge, .status { border:1px solid var(--color-anomaly); padding:5px 7px; color:var(--color-anomaly); font:600 11px/1 var(--font-data); text-transform:uppercase; }
    .status.complete { border-color:var(--color-news); color:var(--color-news); }
    .status.failed { background:var(--color-anomaly); color:var(--color-on-dark); }
    .status.pending { border-color:var(--color-warning); color:var(--color-warning); }
    .anomaly-stats { display:grid; grid-template-columns:repeat(5,1fr); border-bottom:1px solid var(--color-rule); }
    .stat { min-width:0; padding:11px 14px; border-left:1px solid var(--color-rule); }
    .stat:first-child { border-left:0; }
    .stat span { display:block; color:var(--color-ink-muted); font:500 11px/1.3 var(--font-data); text-transform:uppercase; }
    .stat strong { display:block; overflow:hidden; margin-top:4px; font:500 14px/1.35 var(--font-data); text-overflow:ellipsis; white-space:nowrap; }
    .chart-wrap { position:relative; height:clamp(320px,48vh,500px); }
    #price-chart { display:block; width:100%; height:100%; }
    svg text { fill:var(--color-ink-muted); font:500 12px/1 var(--font-data); }
    .grid-line { stroke:var(--color-rule-light); stroke-width:1; }
    .episode-band { fill:var(--color-anomaly); opacity:.09; }
    .price-line { fill:none; stroke:var(--color-ink); stroke-width:2.2; vector-effect:non-scaling-stroke; }
    .detected-line { stroke:var(--color-anomaly); stroke-width:1.2; stroke-dasharray:4 3; }
    .detected-marker { fill:var(--color-anomaly); stroke:var(--color-surface); stroke-width:2; }
    .detected-label { fill:var(--color-anomaly); font:600 9px/1 var(--font-data); letter-spacing:.04em; }
    .confirmed-line { stroke:var(--color-news); stroke-width:1.2; stroke-dasharray:2 3; }
    .confirmed-label { fill:var(--color-news); font:600 9px/1 var(--font-data); letter-spacing:.04em; }
    .story-grid { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--color-rule); background:var(--color-rule); gap:1px; margin-top:16px; }
    .story-card { min-width:0; background:var(--color-surface); }
    .story-body { padding:15px; }
    .verdict { margin:2px 0 12px; color:var(--color-news); font:500 28px/1.05 var(--font-display); }
    .metric-grid { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--color-rule); background:var(--color-rule); gap:1px; }
    .metric { min-width:0; padding:10px; background:var(--color-surface-strong); }
    .metric span { display:block; color:var(--color-ink-muted); font:500 11px/1.3 var(--font-data); text-transform:uppercase; }
    .metric strong { display:block; margin-top:4px; font:600 15px/1.3 var(--font-data); }
    .metric small { display:block; margin-top:3px; color:var(--color-ink-muted); font-size:12px; }
    .reason-list { margin:0; padding-left:21px; }
    .reason-list li + li { margin-top:8px; }
    .news-list { margin:-15px; }
    .corpus-meta { margin:0 0 12px; color:var(--color-ink-muted); font:500 11px/1.4 var(--font-data); text-transform:uppercase; }
    .news-item { padding:12px 15px; border-top:1px solid var(--color-rule-light); }
    .news-item:first-child { border-top:0; }
    .news-item.supporting .news-title { color:var(--color-warning); }
    .news-meta { color:var(--color-news); font:500 10px/1.4 var(--font-data); letter-spacing:.03em; text-transform:uppercase; }
    .news-title { margin-top:4px; font:500 16px/1.3 var(--font-display); }
    .news-title a { color:inherit; text-decoration:none; }
    .news-title a:hover { text-decoration:underline; text-underline-offset:3px; }
    .empty, .error { margin:0; color:var(--color-ink-muted); }
    .error { color:var(--color-anomaly); }
    @media (max-width:900px) {
      .story-grid { grid-template-columns:1fr; }
      .anomaly-stats { grid-template-columns:1fr 1fr; }
      .stat:nth-child(odd) { border-left:0; }
      .stat:nth-child(n+3) { border-top:1px solid var(--color-rule); }
    }
    @media (max-width:620px) {
      .shell { flex-wrap:wrap; }
      .brand { width:auto; flex:1; border-right:0; }
      .shell-meta { display:none; }
      .shell-link { width:100%; min-height:40px; justify-content:center; border-top:1px solid var(--color-rule); border-left:0; }
      main { padding:16px 12px 18px; }
      .episode-nav { align-items:start; flex-direction:column; }
      .episode-controls { width:100%; }
      .episode-controls button, .episode-position { flex:1; }
      .anomaly-stats { grid-template-columns:1fr; }
      .stat, .stat:nth-child(odd) { border-top:1px solid var(--color-rule); border-left:0; }
      .stat:first-child { border-top:0; }
      .chart-wrap { height:300px; }
    }
  </style>
</head>
<body>
<a class="skip" href="#story">Skip to episode replay</a>
<header class="shell">
  <div class="brand"><i class="brand-mark" aria-hidden="true"></i>Crypto Anomaly Analyser</div>
  <div class="runtime">Replay</div>
  <div class="shell-meta" id="replay-day">Loading day</div>
  <a class="shell-link" href="live.html">Live observation →</a>
</header>
<main id="story" tabindex="-1">
  <section class="episode-nav" aria-label="Episode navigation">
    <div><span class="label">BTC live history</span><h1 id="episode-title">Loading episodes</h1></div>
    <div class="episode-controls"><button id="previous-episode" type="button">← Previous</button><span class="episode-position" id="episode-position"></span><button id="next-episode" type="button">Next →</button></div>
  </section>
  <div id="load-error" class="error" role="alert"></div>
  <section class="anomaly-card" id="episode-story" hidden aria-labelledby="anomaly-title">
    <header class="anomaly-head"><h2 id="anomaly-title">Anomaly detected</h2><span class="trigger-badge" id="trigger-badge"></span></header>
    <div class="anomaly-stats"><div class="stat"><span>Episode onset</span><strong id="onset-at"></strong></div><div class="stat"><span>Detected at</span><strong id="detected-at"></strong></div><div class="stat"><span>Onset price</span><strong id="detected-price"></strong></div><div class="stat"><span>Severity</span><strong id="severity"></strong></div><div class="stat"><span>Analysis</span><strong id="episode-status"></strong></div></div>
    <div class="chart-wrap"><svg id="price-chart" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">BTC price around selected episode</title><desc id="chart-desc">Closed five-minute price bars with episode duration shaded and detection marked.</desc></svg></div>
  </section>
  <section class="story-grid" id="story-grid" hidden>
    <article class="story-card"><header class="section-head"><h2>Market activity</h2><span class="status" id="market-status"></span></header><div class="story-body" id="market-body"></div></article>
    <article class="story-card"><header class="section-head"><h2>News RAG</h2><span class="status" id="news-status"></span></header><div class="story-body" id="news-body"></div></article>
    <article class="story-card"><header class="section-head"><h2>LLM analysis</h2><span class="status" id="llm-status"></span></header><div class="story-body" id="llm-body"></div></article>
  </section>
</main>
<script>
const $=selector=>document.querySelector(selector),NS='http://www.w3.org/2000/svg';
const params=new URLSearchParams(location.search),browserZone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',requestedZone=params.get('timezone')||browserZone;
let zone=requestedZone;try{new Intl.DateTimeFormat('en',{timeZone:zone});}catch{zone=browserZone;}
let day=params.get('day'),episodes=[],selected=0;
const fullFormat=new Intl.DateTimeFormat('en-GB',{timeZone:zone,day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const shortFormat=new Intl.DateTimeFormat('en-GB',{timeZone:zone,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const fmtFull=timestamp=>`${fullFormat.format(new Date(timestamp))} ${zone}`;
const fmtPrice=value=>value==null?'Unavailable':`$${Number(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const fmtPercent=(value,places=2)=>value==null?'Unavailable':`${value>=0?'+':''}${(value*100).toFixed(places)}%`;
const esc=text=>String(text??'').replace(/[&<>\"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[char]));
const readerText=text=>String(text).replace(/\bpre-onset\b/gi,'before onset');
const make=(name,attributes={})=>{const element=document.createElementNS(NS,name);Object.entries(attributes).forEach(([key,value])=>element.setAttribute(key,value));return element;};
const statusClass=status=>status==='complete'?'complete':status==='failed'?'failed':'pending';
const statusLabel=status=>status==='complete'?'Complete':status==='failed'?'Failed':'Pending';
const verdictLabels={explained_derivatives:'Explained by market activity',explained_news:'Explained by news',unexplained:'Market normal · no causal news',insufficient_data:'Insufficient data'};
function metric(label,value,note){return `<div class="metric"><span>${label}</span><strong>${value}</strong><small>${note}</small></div>`;}
function articleTiming(article,episode){const published=Date.parse(article.date_pub),delta=published-episode.onset_ts,detectedTs=episode.detected_ts||episode.markets?.price?.detected_ts;if(!Number.isFinite(published))return 'Publication time unavailable';if(delta<0)return `Published ${shortFormat.format(new Date(published))} · before onset`;if(delta===0)return `Published ${shortFormat.format(new Date(published))} · at onset`;if(!detectedTs)return `Published ${shortFormat.format(new Date(published))} · after onset · detection unavailable`;return `Published ${shortFormat.format(new Date(published))} · ${Math.ceil(delta/60000)} min after onset · before detection`;}
function setStatus(selector,status){const node=$(selector);node.className=`status ${statusClass(status)}`;node.textContent=statusLabel(status);}
async function load(){
  try{
    if(!day){const response=await fetch(`/api/live-history/days?${new URLSearchParams({timezone:zone})}`),payload=await response.json();if(!response.ok)throw new Error(payload.error||`HTTP ${response.status}`);day=payload.days[0]?.day;if(!day)throw new Error('No persisted episode yet');}
    const response=await fetch(`/api/live-history/episodes?${new URLSearchParams({day,timezone:zone})}`,{cache:'no-store'}),payload=await response.json().catch(()=>({error:`HTTP ${response.status}`}));
    if(!response.ok)throw new Error(payload.error||`HTTP ${response.status}`);
    episodes=payload.episodes;$('#replay-day').textContent=`${day} · ${zone}`;
    if(!episodes.length)throw new Error(`No episode saved for ${day}`);
    const requested=params.get('event');selected=Math.max(0,episodes.findIndex(episode=>episode.event_reference===requested));render();
  }catch(error){$('#episode-title').textContent='History unavailable';$('#episode-position').textContent='';$('#load-error').textContent=error.message;$('#previous-episode').disabled=$('#next-episode').disabled=true;}
}
function render(){
  const episode=episodes[selected],market=episode.markets.price,analysis=episode.analysis;
  $('#episode-story').hidden=$('#story-grid').hidden=false;$('#load-error').textContent='';
  $('#episode-title').textContent=`Episode ${String(selected+1).padStart(2,'0')}`;$('#episode-position').textContent=`${selected+1} of ${episodes.length}`;$('#previous-episode').disabled=selected===0;$('#next-episode').disabled=selected===episodes.length-1;
  history.replaceState(null,'',`?${new URLSearchParams({day,timezone:zone,event:episode.event_reference})}`);
  const trigger=(market.onset_triggers||market.triggers||[])[0]||'price anomaly',detectedTs=episode.detected_ts||market.detected_ts;$('#trigger-badge').textContent=trigger.replaceAll('_',' ');$('#onset-at').textContent=fmtFull(episode.onset_ts);$('#detected-at').textContent=detectedTs?fmtFull(detectedTs):'Unavailable · legacy row';$('#detected-price').textContent=fmtPrice(market.close_onset);$('#severity').textContent=episode.severity;$('#episode-status').textContent=statusLabel(episode.status);
  setStatus('#market-status',episode.status);setStatus('#news-status',episode.status);setStatus('#llm-status',episode.status);
  if(analysis){const derivatives=analysis.derivatives,candidateCount=analysis.retrieval?.candidate_count??analysis.articles.length;$('#market-body').innerHTML=`<div class="metric-grid">${metric('Funding rate',derivatives.funding_rate_current==null?'Unavailable':`${(derivatives.funding_rate_current*100).toFixed(4)}%`,'Limit ±0.0500%')}${metric('OI change · 4h',fmtPercent(derivatives.oi_change_4h),'Limit ±10%')}</div>`;$('#news-body').innerHTML=analysis.articles.length?`<p class="corpus-meta">${candidateCount} pre-detection candidates · top ${analysis.articles.length} by embedding similarity</p><div class="news-list">${analysis.articles.map((article,index)=>`<article class="news-item ${article.supporting?'supporting':''}"><div class="news-meta">Relevance ${index+1} of ${analysis.articles.length} · similarity ${Number(article.relevance_score).toFixed(4)}</div><div class="news-meta">${esc(articleTiming(article,episode))}</div><div class="news-title"><a href="${esc(article.link)}" target="_blank" rel="noopener noreferrer">${esc(article.title)} ↗</a></div></article>`).join('')}</div>`:'<p class="empty">No relevant article was found before detection.</p>';$('#llm-body').innerHTML=`<div class="verdict">${esc(verdictLabels[analysis.classification]||analysis.classification)}</div><ul class="reason-list">${analysis.synthesis.reasons.map(reason=>`<li>${esc(readerText(reason))}</li>`).join('')}</ul>`;}
  else {const message=episode.status==='failed'?episode.error:'Analysis is queued.';$('#market-body').innerHTML=$('#news-body').innerHTML=$('#llm-body').innerHTML=`<p class="${episode.status==='failed'?'error':'empty'}">${esc(message)}</p>`;}
  drawChart(episode);
}
function drawChart(episode){
  const svg=$('#price-chart'),title=svg.querySelector('title'),desc=svg.querySelector('desc'),all=episode.bars,startCut=episode.onset_ts-4*3600000,bars=all.filter(bar=>bar.ts>=startCut),detectedTs=episode.detected_ts||episode.markets.price.detected_ts,W=1000,H=Math.max(300,W*(svg.clientHeight||400)/(svg.clientWidth||1000)),left=78,right=24,top=28,bottom=H-42;svg.replaceChildren(title,desc);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const start=bars[0].ts,end=Math.max(bars.at(-1).ts,detectedTs||0),values=bars.map(bar=>bar.close),rawLow=Math.min(...values),rawHigh=Math.max(...values),padding=Math.max((rawHigh-rawLow)*.1,rawHigh*.001),low=rawLow-padding,high=rawHigh+padding,x=timestamp=>left+(timestamp-start)/Math.max(end-start,300000)*(W-left-right),y=value=>bottom-(value-low)/(high-low)*(bottom-top);
  for(let index=0;index<=4;index++){const value=low+(high-low)*index/4,py=y(value);svg.append(make('line',{x1:left,x2:W-right,y1:py,y2:py,class:'grid-line'}));const label=make('text',{x:left-8,y:py+4,'text-anchor':'end'});label.textContent=`$${Math.round(value).toLocaleString('en-US')}`;svg.append(label);}
  for(let index=0;index<=4;index++){const timestamp=start+(end-start)*index/4,px=x(timestamp);svg.append(make('line',{x1:px,x2:px,y1:top,y2:bottom,class:'grid-line'}));const label=make('text',{x:px+(index===4?-3:3),y:bottom+24,'text-anchor':index===4?'end':'start'});label.textContent=shortFormat.format(new Date(timestamp));svg.append(label);}
  const market=episode.markets.price,bandEnd=Math.min(end,episode.onset_ts+market.duration_bars*300000),onsetX=x(episode.onset_ts),onsetBar=bars.find(bar=>bar.ts===episode.onset_ts)||bars[0];svg.append(make('rect',{x:onsetX,y:top,width:Math.max(2,x(bandEnd)-onsetX),height:bottom-top,class:'episode-band'}));const path=bars.map((bar,index)=>`${index?'L':'M'}${x(bar.ts).toFixed(2)},${y(bar.close).toFixed(2)}`).join(' ');svg.append(make('path',{d:path,class:'price-line'}),make('line',{x1:onsetX,x2:onsetX,y1:top,y2:bottom,class:'detected-line'}));const alignLeft=onsetX>W-150,onsetLabel=make('text',{x:onsetX+(alignLeft?-7:7),y:top+13,'text-anchor':alignLeft?'end':'start',class:'detected-label'});onsetLabel.textContent='ONSET';svg.append(onsetLabel,make('circle',{cx:onsetX,cy:y(onsetBar.close),r:6,class:'detected-marker'}));if(detectedTs){const confirmationX=x(detectedTs),confirmationLabel=make('text',{x:confirmationX-7,y:top+26,'text-anchor':'end',class:'confirmed-label'});confirmationLabel.textContent='DETECTED';svg.append(make('line',{x1:confirmationX,x2:confirmationX,y1:top,y2:bottom,class:'confirmed-line'}),confirmationLabel);}
}
$('#previous-episode').addEventListener('click',()=>{if(selected>0){selected--;render();scrollTo({top:0,behavior:'smooth'});}});$('#next-episode').addEventListener('click',()=>{if(selected<episodes.length-1){selected++;render();scrollTo({top:0,behavior:'smooth'});}});addEventListener('resize',()=>{if(episodes.length)drawChart(episodes[selected]);});void load();
</script>
</body>
</html>
