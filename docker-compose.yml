services:
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgresql://${PGVECTOR_USER:-crypto}:${PGVECTOR_PASSWORD:?Set PGVECTOR_PASSWORD in .env}@pgvector:5432/${PGVECTOR_DB:-crypto}
      NEWS_API_URL: http://news:3000/api/news
      NEWS_API_SECRET: ${NEWS_API_SECRET:?Set NEWS_API_SECRET in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding}
      RAGAS_JUDGE_MODEL: ${RAGAS_JUDGE_MODEL:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3

  news:
    build: ../free-crypto-news
    init: true
    restart: unless-stopped
    environment:
      SPERAXOS_API_SECRET: ${NEWS_API_SECRET:?Set NEWS_API_SECRET in .env}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--header=User-Agent: crypto-analyser/1 live-rag", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3

  pgvector:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-crypto}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?Set PGVECTOR_PASSWORD in .env}
      POSTGRES_DB: ${PGVECTOR_DB:-crypto}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
